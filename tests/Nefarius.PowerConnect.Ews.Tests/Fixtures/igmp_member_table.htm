function addMySelectionList()
{
var formele=document.IgmpMemberForm.elements;
var optionNo=1;
var optionIndex=0;
queryMatch=false;
selectName=formele["dot1qTpGroupAddress$select"];
selName=formele["dot1qVlanIndex$select"];
formele["dot1qTpGroupAddress$select"].remove(0);
formele["dot1qTpGroupAddress$select"][0]=null;
while (formele["dot1qVlanIndex$repeat?"+optionNo])
{
if ((formele["dot1qVlanIndex$repeat?"+optionNo].value)==(selName.options[selName.selectedIndex].text))
{
if ((formele["dot1qTpGroupAddress$repeat?"+optionNo].value).indexOf("01005e")==0)
{
text=fromMulticastMacToIP(formele["dot1qTpGroupAddress$repeat?"+optionNo].value,true);
}
else
{
text=fromStringToMacAddress(formele["dot1qTpGroupAddress$repeat?"+optionNo].value);
}
newOption = new Option(text);
selectName.options[optionIndex]=newOption;
if ((formele["dot1qTpGroupAddress$query"].value==formele["dot1qTpGroupAddress$repeat?"+optionNo].value)&&(formele["dot1qVlanIndex$query"].value)==(selName.options[selName.selectedIndex].text))
queryMatch=true;
optionIndex++;
}
optionNo++;
}
if ((formele["dot1qTpGroupAddress$select"][0])&&(!queryMatch || pageAfterClear))
{
selectName.selectedIndex=0;
selectQuery();
}
if (!(formele["dot1qTpGroupAddress$select"][0]))
{
selectName.disabled=true;
formele["RemoveCBox"].disabled=true;
clearImages();
}
else
{
selectName.disabled=false;
formele["RemoveCBox"].disabled=false;
}
}
function checkStaticOrDynamicAddress()
{
var formele=document.IgmpMemberForm.elements;
var entryNo=1;
selectName=formele["dot1qTpGroupAddress$select"];
selName=formele["dot1qVlanIndex$select"];
var addVal="";
while (formele["dot1qVlanIndex$repeatOnStatic?"+entryNo])
{
if ((formele["dot1qStaticMulticastAddress$repeatOnStatic?"+entryNo].value).indexOf("01005e")==0)
{
addVal=fromMulticastMacToIP(formele["dot1qStaticMulticastAddress$repeatOnStatic?"+entryNo].value,true);
}
else
{
addVal=fromStringToMacAddress(formele["dot1qStaticMulticastAddress$repeatOnStatic?"+entryNo].value);
}
if ((formele["dot1qVlanIndex$repeatOnStatic?"+entryNo].value==selName.options[selName.selectedIndex].text)&&
(addVal==selectName.options[selectName.selectedIndex].text))
{
isStaticAddress=true;
break;
}
entryNo++;
}
if (isStaticAddress==false)
formele["RemoveCBox"].disabled=true;
}
function indexSignAddress(selectObject)
{
var i=0;
formele=document.forms[0].elements;
selectName=formele[selectObject];
queryObject=getBaseName(selectObject)+"$query"
var val=fromMulticastMacToIP(formele[queryObject].value,true);
while (selectName.options[i]!=null)
{
if (selectName.options[i].text == val || selectName.options[i].text==fromStringToMacAddress(formele[queryObject].value))
{
selectName.selectedIndex=i;
break;
}
i++;
}
if(formele[queryObject].value==top.queryNA)
selectName.selectedIndex=-1;
}
