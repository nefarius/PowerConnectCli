<script language="JavaScript">
<!-- Beginng of JavaScript Applet
if(top.MonitorMode) {
document.write("<link rel='stylesheet' href='../device/monitorMode.css' type='text/css'>")
}
if(top.MonitorMode) {
document.write("<link rel='stylesheet' href='../device/monitorMode.css' type='text/css'>")
}
function openShowAllPage(){
window.open("vlan_port_table.htm?[vlanPortTable]partialKey:From-rlPhdPortsIfIndex=0-Counter-12[vlanTable]partialKey:From-dot1qVlanIndex=0-Counter-12[uiTable]partialKey:From-rlPhdPortsIfIndex=0-Counter-12","", "width=850, height=600, left=50, top=50, scrollbars=yes, resizable=yes");
}
function selectInterface() {
var portIndex = getInteface();
var queryStr = "vlan_iterface.htm?[dot1qPortVlanTableVT]Query:dot1dBasePort=" + portIndex;
document.location.href = queryStr;
}
function getInteface() {
var portSelect = document.getElementById("portSelect");
return (getPortNumberFromName(portSelect.options[portSelect.selectedIndex].text));
}
function selectChosenInterface() {
var portIndex = parseInt(vlanInterfaceForm.elements["dot1dBasePort$query"].value);
var portSelect = document.getElementById("portSelect");
var i=0;
while (portSelect.options[i].value != portIndex) {
i++;
}
portSelect.selectedIndex = i
}
function showPVID() {
var pvidText = document.getElementById("pvidText");
pvidText.value = vlanInterfaceForm.elements["dot1qPvid$query"].value;
}
function displayFrameType() {
var combo = document.getElementById("frameTypeSelect");
combo.value = vlanInterfaceForm.elements["dot1qPortAcceptableFrameTypes$query"].value;
}
function displayFiltering() {
var combo = document.getElementById("filteringSelect");
combo.value = vlanInterfaceForm.elements["dot1qPortIngressFiltering$query"].value;
}
function changeFrameType() {
var combo = document.getElementById("frameTypeSelect");
vlanInterfaceForm.elements["dot1qPortAcceptableFrameTypes$query"].value = combo.value;
}
function changeFiltering() {
var combo = document.getElementById("filteringSelect");
vlanInterfaceForm.elements["dot1qPortIngressFiltering$query"].value = combo.value;
}
function formSubmit(){
var pvidCtrl = document.getElementById("pvidText");
var val = pvidCtrl.value;
if ( !checkInteger( val ) )
{
alert("The '" + val + "' must be an integer");
return;
}
var pvid = parseInt(val);
if(isNaN(pvid) || pvid < 1 || pvid > 4095) {
alert("Please enter a valid value for PVID");
pvidCtrl.select();
return;
}
vlanInterfaceForm.elements["dot1qPvid$query"].value = pvidCtrl.value;
vlanInterfaceForm.submit();
}
// --End of Java code -->
</script>
</head>
