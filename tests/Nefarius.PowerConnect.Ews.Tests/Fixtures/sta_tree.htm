function ChangeMigration(){
formele=document.staTreeForm.elements;
var stpOpMode = parseInt(formele["dot1dStpVersion"].value);

if (formele["CBoxMigration"].checked==true) {

} else {
formele["dot1dStpPortProtocolMigration$query"].value=2;
}

}
}
