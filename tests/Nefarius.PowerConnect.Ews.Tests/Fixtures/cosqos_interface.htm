function formSubmit()
{

{
formele["rlIfIndex$query"].value = top.rlIfIndex;

}
function submitQuery()
{
selectList=formele["port"];
interfaceValue = selectList[selectList.selectedIndex].value;
top.rlIfType = 2;
top.rlIfIndex = interfaceValue;
var newFilter="cosqos_interface.htm?Query:rlIfIndex=";
newFilter+=interfaceValue;
newFilter+="@rlIfType=2";
document.location.href=newFilter;
}
function ifIndexSign()
{
if (formele["rlIfIndex$query"].value!=top.queryNA)
{
if (formele["rlIfIndex$query"].value>=parseInt(top.trunkFirstIndex))
{
formele["PortTrunkVlan"][1].checked=true;
formele["port"].disabled=true;
formele["trunk"].disabled=false;
formele["trunk"].selectedIndex=(parseInt(formele["rlIfIndex$query"].value)-parseInt(top.trunkFirstIndex));
}
else
{
formele["PortTrunkVlan"][0].checked=true;
formele["port"].disabled=false;
formele["trunk"].disabled=true;
i=0;
while (formele["port"].options[i].value!=parseInt(formele["rlIfIndex$query"].value))
i++;
formele["port"].selectedIndex=i;
}
}
}
function selectInterface()
{
portIndex=getInteface();
top.rlIfType = 2;
top.rlIfIndex = portIndex;
if (checkEntry(portIndex))
{
var queryStr="cosqos_interface.htm?[IfPolicyVT]Query:rlIfType=2@rlIfIndex="+portIndex;
document.location.href=queryStr;
}
else
{
addEntry1(portIndex);
}
}
function disableHtml(){
formele=document.cosqosInterfaceForm.elements;
formele["port"].disabled=true;
formele["trunk"].disabled=true;
formele["PortTrunkVlan"][0].disabled=true;
formele["PortTrunkVlan"][1].disabled=true;
formele["QosIfTrustActive"].disabled=true;
formele["dot1dPortDefaultUserPriority$select"].disabled=true;
}
function indexSign()
{
var i=0;

{

formele["rlIfType$query"].value = top.rlIfType;
}

}
function cBoxQosIfTrustActive()
{
formele["QosIfTrustActive"].checked = (formele["rlQosIfTrustActive$query"].value == "1");
top.rlIfType=2;
top.rlIfIndex=1;
}
function getInteface()
{
if (formele["PortTrunkVlan"][1].checked==true)
return (formele["trunk"].selectedIndex+parseInt(top.trunkFirstIndex));
else
return (getPortNumberFromName(formele["port"].options[formele["port"].selectedIndex].text));
}
function checkEntry(index)
{
i=1;
while (formele["rlIfIndex$repeat?"+i])
if (formele["rlIfIndex$repeat?"+i].value==index)
return true
else
i++;
return false;
}
function disableQuery()
{
formele["IfPolicyVT$query"].disabled=true;
formele["rlIfIndex$query"].disabled=true;
formele["rlIfType$query"].disabled=true;
formele["rlQosIfPolicyMapStatus$query"].disabled=true;
formele["IfPolicyVT$endQuery"].disabled=true;
}
function addEntry1(port)
{
disableQuery();
disableHtml();
formele["dot1dPortDefaultUserPriority$query"].disabled=true;
formele["rlQosIfTrustActive$query"].disabled=true;
formele["rlIfIndex$add"].disabled=false;
formele["rlIfType$add"].disabled=false;
formele["rlQosIfPolicyMapStatus$add"].disabled=false;
formele["IfPolicyVT$endAdd"].disabled=false;
formele["rlIfIndex$add"].value=port;
formele["rlIfType$add"].value=2;
formele["rlQosIfPolicyMapStatus$add"].value=4;
document.cosqosInterfaceForm.submit();
}
function windowOpen()

}
