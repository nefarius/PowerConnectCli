function formSubmit()
{
var flagDel = false;
var formObj=document.dhcpAddrBindForm;
var i = 1;
while (formele["del_cb"+i]!=null)
{
formele["del_cb"+i].disabled = true;
if(formele["del_cb"+i].checked)
{
prepareHostEntry(i);
flagDel = true;
}
i++;
}
if(!flagDel)
{
alert("No entries were selected for deletion.");
return false;
}
formObj.submit();
}
function prepareHostEntry(ind)
{
formele["rlDhcpSrvIpAddrIpAddr$repeat?"+ind].disabled = false;
formele["rlDhcpSrvIpAddrRowStatus$repeat?"+ind].disabled = false;
formele["DHCPIPVT$endRepeat?"+ind].disabled = false;
formele["rlDhcpSrvIpAddrRowStatus$repeat?"+ind].value = 6;
}
function isInDelArray(name)
{
for(var i = 0; i < delParams.length; i++)
{
if(name == delParams[i])
return true;
}
return false;
}
function displayExpiration(index)
{
var val = "Infinite";
if(getType(index)=="Dynamic")
val = calculateExpiration(index);
document.write(val);
}
function calculateExpiration(index)
{
var res = "";
var currDate = formele["rndTimeSyncManagedDateTime"].value;
var currDay = currDate.substr(0,2);
var currMonth = currDate.substr(2,2);
var currYear = "20"+currDate.substr(4,2);
var currHour = currDate.substr(6,2);
var currMin = currDate.substr(8,2);
var currSec = currDate.substr(10,2);
var dateNow = new Date();
dateNow.setFullYear(parseInt(currYear),parseInt(currMonth-1),parseInt(currDay));
dateNow.setHours(parseInt(currHour),parseInt(currMin),parseInt(currSec));
var secLease = parseInt(formele["rlDhcpSrvDynamicLeaseTime$query"].value,10);
var secAged = parseInt(formele["rlDhcpSrvIpAddrAgeTime$repeat?"+index].value,10);
var milliSecRemain = (secLease - secAged) * 1000;
var projectedExpiration = dateNow.getTime() + milliSecRemain;
var dateExpire = new Date();
dateExpire.setTime(projectedExpiration);
var dispMonth = monthArr[parseInt(dateExpire.getMonth(),10)];
var dispDay = dateExpire.getDate();
var dispYear = dateExpire.getFullYear();
var dispHour = prepForDisp(dateExpire.getHours());
var dispMin = prepForDisp(dateExpire.getMinutes());
var dispSec = prepForDisp(dateExpire.getSeconds());
res = dispMonth + " " + dispDay + " " + dispYear + " " + dispHour + ":" + dispMin + ":" + dispSec;
return res;
}
function prepForDisp(input)
{
var val = input.toString();
if(val.length == 1)
val = "0" + val;
return val;
}
function getType(index)
{
var typeEnum = formele["rlDhcpSrvIpAddrMechanism$repeat?"+index].value;
switch(typeEnum)
{
case "1":
return "Static";
case "2":
return "Permanent";
case "3":
return "Dynamic";
}
}
function displayID(index)
{
var val = formele["rlDhcpSrvIpAddrIdentifier$repeat?"+index].value;
var type = formele["rlDhcpSrvIpAddrIdentifierType$repeat?"+index].value;
if(type == "1")
val = fromStringToMacAddress(val);
document.write(val);
}
function initPaging()
{
if(loopIndex == 13)
document.getElementById("repRow_13").style.display = "none";
else
disableButton('nextLink');
if(formele["restoreUrl"].value.indexOf("partialKey")==-1)
disableButton('backLink');
}
function disableButton(id)
{
var link = document.getElementById(id);
link.href = "javascript:function(){return};";
link.style.cursor = "default";
}
function GetNextEntries()
{
var lastEntryIndex = formele["rlDhcpSrvIpAddrIpAddr$repeat?12"].value;
var navigateNext = "[DHCPIPVT]partialKey:From-rlDhcpSrvIpAddrIpAddr="+lastEntryIndex;
var oldQuery = formele["restoreUrl"].value;
var pagerIndex = oldQuery.indexOf("[DHCPIPVT]");
var pageCounter = pageIndex + 1;
if(pagerIndex != -1)
{
oldQuery = oldQuery.substring(0,pagerIndex)
}
var newUrlVal = 'DHCPSrv_AddrBind.htm?' + oldQuery + navigateNext + "^pagenum=" + pageCounter;
document.location.href = newUrlVal;
}
function getPageIndex()
{
var urlVal = formele["restoreUrl"].value;
var pagerIndex = urlVal.indexOf("pagenum");
if(pagerIndex==-1)
pageIndex = 0;
else
{
var pagerStr = urlVal.substring(pagerIndex+8);
pageIndex = parseInt(pagerStr,10);
}
}
