function displayState() {
formele=document.staTrunkConfigForm.elements;
var value = formele["dot1dStpPortState$query"].value;
var textValue = "";
var case2="Blocking";
var case3="Listening";
var stpOpMode=formele["dot1dStpVersion"].value;
if(parseInt(stpOpMode)==2){
case2="Discarding";
case3="Discarding";
}
switch(value)
{
case "1":
textValue = "Disabled";
break;
case "2":
textValue = case2;
break;
case "3":
textValue = case3;
break;
case "4":
textValue = "Learning";
break;
case "5":
textValue = "Forwarding";
break;
default:
break;
}
document.write(textValue);
}
function displayFastMode()
{
formele=document.staTrunkConfigForm.elements;
var fastMode = formele["dot1dStpPortAdminEdgePort$query"].value;
if(fastMode==1)
formele["portFastMode$select"].selectedIndex=0;
else
{
var autoMode = formele["rldot1dStpPortAutoEdgePort$query"].value;
if(autoMode == 1)
formele["portFastMode$select"].selectedIndex=1;
else
formele["portFastMode$select"].selectedIndex=2;
}
}
function displayDesignatedBridge()
{
formele=document.staTrunkConfigForm.elements;
var designatedBridgeVal=formele["dot1dStpPortDesignatedBridge$query"].value;
var strLength = designatedBridgeVal.length ;
var periorLen = strLength - 12 ;
var leftStr = designatedBridgeVal.substring(0,periorLen) ;
var rightStr = designatedBridgeVal.substring(periorLen,designatedBridgeVal.length) ;
leftStr = hexToDec(leftStr);
var displayStr = leftStr + '-' + fromStringToMacAddress(rightStr) ;
var portStateValue = formele["dot1dStpPortState$query"].value;
var portEnableValue = formele["dot1dStpPortEnable$query"].value;
if ((parseInt(portStateValue) == 1) || (parseInt(portEnableValue)== 2) )
{
displayStr = 'N/A';
}
document.write( displayStr);
}
function displayDesignatedPort()
{
formele=document.staTrunkConfigForm.elements;
var designatedPortVal=formele["dot1dStpPortDesignatedPort$query"].value;
var strLength = designatedPortVal.length ;
var portLen = strLength - 3 ;
var leftStr = designatedPortVal.substring(0,portLen);
var rightStr = hexToDec(designatedPortVal.substring(portLen,strLength));
leftStr = hexToDec(leftStr+'0');
var displayStr = leftStr + '-' + rightStr ;
var portStateValue = formele["dot1dStpPortState$query"].value;
var portEnableValue = formele["dot1dStpPortEnable$query"].value;
if ((parseInt(portStateValue) == 1) || (parseInt(portEnableValue)== 2) )
{
displayStr = 'N/A';
}
document.write( displayStr);
}
function displayDesignatedTransitions()
{
formele=document.staTrunkConfigForm.elements;
var designatedTransitionsVal=formele["dot1dStpPortForwardTransitions$query"].value;
var portStateValue = formele["dot1dStpPortState$query"].value;
var portEnableValue = formele["dot1dStpPortEnable$query"].value;
if ((parseInt(portStateValue) == 1) || (parseInt(portEnableValue)== 2) )
{
designatedTransitionsVal = 'N/A';
}
document.write( designatedTransitionsVal);
}
function displayRootGuard()
{
formele=document.staTrunkConfigForm.elements;

}
else
{
formele["rootGuard$cb"].checked = false;
}
}

{
formele=document.staTrunkConfigForm.elements;

var portStateValue = formele["dot1dStpPortState$query"].value;

if ( (parseInt(portStateValue) == 1) || (parseInt(portEnableValue)== 2) )
{

}

}
function disableHtml()
{
formele=document.staTrunkConfigForm.elements;
formele["defaultPathCost$cb"].disabled=true;
formele["dot3adAggIndex$select"].disabled=true;
formele["rootGuard$cb"].disabled=true;
formele["fastLink$cb"].disabled=true;
formele["dot1dStpPortPriority$select"].disabled=true;
}
function selectIndex() {
var interfaceValue;
var selectList;
var formele=document.staTrunkConfigForm.elements;
selectList=formele["dot3adAggIndex$select"];
interfaceValue = selectList[selectList.selectedIndex].value;
var newFilter="sta_trunk.htm?Query:dot3adAggIndex=";
newFilter+=interfaceValue;
filterString=newFilter;
disableHtml();
document.location.href=filterString;
}
function indexSign() {
var i=0;
var formele=document.staTrunkConfigForm.elements;
var selectList;
selectList=formele["dot3adAggIndex$select"];
while (selectList.options[i]!=null)
{
if (selectList.options[i].value == formele["dot3adAggIndex$query"].value)
{
selectList.selectedIndex=i;
break;
}
i++;
}
}
function formSubmit()
{
formele=document.staTrunkConfigForm.elements;
selectList=formele["dot3adAggIndex$select"];
formele["dot3adAggIndex$query"].value = selectList[selectList.selectedIndex].value;
if (formele["fastLink$cb"].checked==true){
formele["dot1dStpPortAdminEdgePort$query"].value=1;
}
else {
formele["dot1dStpPortAdminEdgePort$query"].value=2;
}
if (formele["defaultPathCost$cb"].checked==true)
{
formele["dot1dStpPortPathCost$query-eqVal"].disabled=true;
formele["dot1dStpPortAdminPathCost$query"].value=0;
}
else
{
formele["dot1dStpPortAdminPathCost$query"].disabled=true;
}
if(formele["rootGuard$cb"].checked)
{
formele["rldot1dStpPortRestrictedRole$query"].value = 1;
}
else
{
formele["rldot1dStpPortRestrictedRole$query"].value = 2;
}
if(formele["dot1dStpPortPriority$select"].value!=formele["dot1dStpPortPriority$query"].value)
formele["dot1dStpPortPriority$query"].value=formele["dot1dStpPortPriority$select"].value;
else
formele["dot1dStpPortPriority$query"].disabled=true;
disableHtml();
document.staTrunkConfigForm.submit();
}
function checkPriority(fldName) {
formele=document.staTrunkConfigForm.elements;
if (top.fldToCheck=="")
{
top.fldToCheck=fldName;
}
else if(top.fldToCheck!=fldName){
return
}
var errMsg=checkType(fldName,"int");
if (errMsg)
{
if(formele[fldName].value=="" || formele[fldName].value==" ")
{
alert("Blank is not a legal value");
formele[fldName].value= formele[fldName].defaultValue;
top.fldToCheck="";
}
else{
alert(errMsg);
formele[fldName].focus();
setTimeout('checkFocus()',5);
}
}
else{
var priority = (formele[fldName].value)*1 ;
if ( (priority < 0) || (priority > 240) || ((priority%16)!=0) )
{
alert ("Priority should be between 0 and 240 in steps of 16.");
formele[fldName].focus();
setTimeout('checkFocus()',5);
}
else{
top.fldToCheck="";
}
}
}
function changeEnablePathCost(){
formele=document.staTrunkConfigForm.elements;
if (formele["defaultPathCost$cb"].checked==true) {
formele["dot1dStpPortPathCost$query-eqVal"].disabled=true;
}
else {
formele["dot1dStpPortPathCost$query-eqVal"].disabled=false;
}
}
function displayRole(){
formele=document.staTrunkConfigForm.elements;

function displayEdge() {
formele=document.staTrunkConfigForm.elements;

formele["fastLink$cb"].checked=true;
}
