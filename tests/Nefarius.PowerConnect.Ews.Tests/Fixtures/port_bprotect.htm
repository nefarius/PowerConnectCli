<html>
<head>
<title>Storm Control</title>

<script language="JavaScript">
<!-- Beginng of JavaScript Applet
if(top.MonitorMode) {
document.write("<link rel='stylesheet' href='../device/monitorMode.css' type='text/css'>")
}
function formSubmit() {
if ( MBytesToBits() )
{
disableHTML();
document.portBProtectConfigForm.submit();
}
}
function disableHTML() {
var formele=document.portBProtectConfigForm.elements;
formele["dot1dBasePort$select"].disabled=true;
formele["broadcastMode$select"].disabled=true;
formele["rlStormCtrlBroadcastEnable"].disabled=true;
formele["rlStormCtrlBroadcastRate"].disabled=true;
}
function selectPort() {
var selectName=document.portBProtectConfigForm.elements["dot1dBasePort$select"];
var newFilter="port_bprotect.htm?Query:dot1dBasePort=";
newFilter+=parseInt(selectName.options[selectName.selectedIndex].text);
document.location.href=newFilter;
}
function countBroadcastPcktsClick() {
var formele=document.portBProtectConfigForm.elements;
if (formele["rlStormCtrlBroadcastEnable"].checked==true) {
formele["rlStormCtrlBroadcastEnable$query"].value=1;
formele["rlStormCtrlSetDefaultBroadcastEnable$query"].disabled=true;
} else {
formele["rlStormCtrlBroadcastEnable$query"].value=2;
formele["rlStormCtrlBroadcastEnable$query"].disabled=true;
formele["rlStormCtrlSetDefaultBroadcastEnable$query"].value=1;
}
}
function selectBroadcastMode() {
var formele=document.portBProtectConfigForm.elements;
if (formele["broadcastMode$select"].selectedIndex==0) {
formele["rlStormCtrlMulticastEnable$query"].value=1;
formele["rlStormCtrlSetDefaultMulticastEnable$query"].disabled=true;
formele["rlStormCtrlUnknownUnicastEnable$query"].value=1;
formele["rlStormCtrlSetDefaultUnknownUnicastEnable$query"].disabled=true;
} else {
if (formele["broadcastMode$select"].selectedIndex==1) {
formele["rlStormCtrlMulticastEnable$query"].value=1;
formele["rlStormCtrlSetDefaultMulticastEnable$query"].disabled=true;
formele["rlStormCtrlUnknownUnicastEnable$query"].disabled=true;
formele["rlStormCtrlSetDefaultUnknownUnicastEnable$query"].value=1;
} else {
formele["rlStormCtrlMulticastEnable$query"].disabled=true;
formele["rlStormCtrlSetDefaultMulticastEnable$query"].value=1;
formele["rlStormCtrlUnknownUnicastEnable$query"].disabled=true;
formele["rlStormCtrlSetDefaultUnknownUnicastEnable$query"].value=1;
}
}
}
function setBroadcastMode() {
var formele=document.portBProtectConfigForm.elements;
if(formele["rlStormCtrlMulticastEnable$query"].value==1) {
var unknownUnicastEnable = (formele["rlStormCtrlUnknownUnicastEnable$query"].value == 1);
formele["broadcastMode$select"].selectedIndex = unknownUnicastEnable ? 0 : 1;
} else {
formele["broadcastMode$select"].selectedIndex = 2;
}
}
function openShowAll() {
window.open('port_bprotect_table.htm','', 'width=850, height=600, left=50, top=50, scrollbars=yes, resizable=yes');
}
function MakeChecked() {
var formele=document.portBProtectConfigForm.elements;
formele["rlStormCtrlBroadcastEnable"].checked = (formele["rlStormCtrlBroadcastEnable$query"].value == 1) ? true : false;
}
function MBytesToBits() {
var result = true;
var formele=document.portBProtectConfigForm.elements;
if(formele["rlStormCtrlBroadcastRate"].value !== "") {
var val = new Number(formele["rlStormCtrlBroadcastRate"].value);
var vls = formele["rlStormCtrlBroadcastRate"].value;
var val_less_than_3dot5 = (val < 3.5);
if (!val_less_than_3dot5 && (val == 3.5)) {
if (vls.indexOf(".5") < 0)
val_less_than_3dot5 = true;
}
var val_grtr_than_1000 = (val > 1000);
if (!val_grtr_than_1000 && (val == 1000)) {
var tmp = vls.split(".");
if (tmp.length > 1) {
if (parseInt(tmp[1]) > 0)
val_grtr_than_1000 = true;
}
}
if (isNaN(val) || val_less_than_3dot5) {
result = false;
alert("The value should not be less than 3.5");
} else if (val_grtr_than_1000) {
result = false;
alert("The value should not be greater than 1000");
}
var rate = Math.round(val *1000);
formele["rlStormCtrlBroadcastRate$query"].value = rate;
} else {
formele["rlStormCtrlBroadcastRate"].value = formele["rlStormCtrlBroadcastRate$query"].value/( 1000);
}
return result;
}
// --End of Java code -->
</script>
</head>
