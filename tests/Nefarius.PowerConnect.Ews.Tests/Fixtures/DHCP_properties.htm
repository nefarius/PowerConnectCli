


<html>
<head>
<title>DHCP Server Properties</title>
<link rel="stylesheet" href="../device/style.css" type="text/css">
<script src="../js/globalFunctions.js"></script>
<script language="JavaScript">
if(top.MonitorMode) {
document.write("<link rel='stylesheet' href='../device/monitorMode.css' type='text/css'>")
}
function formSubmit()
{
if (formele["rlDhcpSrvProbeEnable"].value!=2)
{
top.fldToCheck = "";
if(formele["txtRetries"].disabled == false)
if (!checkValidation('Ping Retries','','txtRetries',false,'int',1,10))
return false;
top.fldToCheck = "";
if(formele["txtTimeout"].disabled == false)
if (!checkValidation('Ping Timeout','','txtTimeout',false,'int',300,10000))
return false;
}
formele["rlDhcpSrvEnable"].value=formele["Select2"].value;
if((formele["rlGlobalIpAdOwner$repeat?1"].value == 2) && (formele["rlDhcpSrvEnable"].value == 1)){
alert("DHCP server can't be configured. In order to enable DHCP server remove DHCP client on all interfaces.");
return false;
}
formele["rlDhcpSrvProbeEnable"].value=formele["selPing"].value;
if (formele["rlDhcpSrvProbeEnable"].value==2)
{
formele["rlDhcpSrvProbeRetries"].disabled=true;
formele["rlDhcpSrvProbeTimeout"].disabled=true;
}
else
{
formele["rlDhcpSrvProbeRetries"].disabled=false;
formele["rlDhcpSrvProbeRetries"].value=formele["txtRetries"].value;
formele["rlDhcpSrvProbeTimeout"].disabled=false;
formele["rlDhcpSrvProbeTimeout"].value=formele["txtTimeout"].value;
if (formele["chkRetries"].checked==true)
formele["rlDhcpSrvProbeRetries"].value=2;
if (formele["cbUseDefault"].checked==true)
formele["rlDhcpSrvProbeTimeout"].value=500;
}
disableHTML();
document.DHCPPropertiesForm.submit();
}
function setPingState()
{
if (formele["selPing"].value==2)
{
setDisabled(formele["txtRetries"],true);
setDisabled(formele["txtTimeout"],true);
formele["chkRetries"].disabled=true;
formele["cbUseDefault"].disabled=true;
formele["rlDhcpSrvProbeEnable"].value=2;
}
else
{
setDisabled(formele["txtRetries"],false);
setDisabled(formele["txtTimeout"],false);
formele["chkRetries"].disabled=false;
formele["cbUseDefault"].disabled=false;
formele["rlDhcpSrvProbeEnable"].value=1;
}
}
function disableHTML()
{ formele["txtRetries"].disabled=true;
formele["txtTimeout"].disabled=true;
formele["Select2"].disabled=true;
formele["selPing"].disabled=true;
formele["cbUseDefault"].disabled=true;
formele["chkRetries"].disabled=true;
}
function setRetriesDef(cntrl)
{
setDisabled(formele["txtRetries"],cntrl.checked);
}
function setTimeOutDef(cntrl)
{
setDisabled(formele["txtTimeout"],cntrl.checked);
}
function signControls()
{
formele["Select2"].value=formele["rlDhcpSrvEnable"].value;
formele["selPing"].value=formele["rlDhcpSrvProbeEnable"].value;
formele["txtRetries"].value=formele["rlDhcpSrvProbeRetries"].value;
formele["txtTimeout"].value=formele["rlDhcpSrvProbeTimeout"].value;
setPingState();
}
function callSubmit()
{
if (opener)
{
docObj.popHndl=window.self;
}
else
{
docObj.popHndl=top.main;
}
docObj.locationHndl=(document.location.pathname+"?")
if (document.forms[0].restoreUrl)
docObj.locationHndl+=(document.forms[0].restoreUrl.value);
formSubmit();
}
// --End of Java code -->
</script>
</head>
