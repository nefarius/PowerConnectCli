function memberToStaticStrings()
{

var vlanStaticEgressChanged = false ;
var vlanStaticUntaggedChanged = false ;

vlanStaticUntaggedTemp += '0' ;
vlanForbiddenTemp += '0' ;

default:

{

break;
default: break;
}

vlanStaticEgressChanged=true;
if (vlanStaticUntaggedTemp.charAt(vlanStaticUntaggedTemp.length-1)!='0')
vlanStaticUntaggedChanged=true;
if (vlanForbiddenTemp.charAt(vlanForbiddenTemp.length-1)!='0')

}

document.VlanMemberForm.dot1qVlanStaticEgressPorts$query.value = bitsAsCharsToOctet(vlanStaticEgressTemp);
else document.VlanMemberForm.dot1qVlanStaticEgressPorts$query.value ="";

}
