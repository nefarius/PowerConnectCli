<script language="JavaScript">
<!-- Beginng of JavaScript Applet
if(top.MonitorMode)
{
document.write("<link rel='stylesheet' href='../device/monitorMode.css' type='text/css'>")
}
var isPasswordChanged=false;
var passwordMinVal=0;
function formSubmit()
{
var formele=document.secDBForm.elements;
if (formele["rlAAALocalUserName$select"].options.length>0)
{
if (formele["rlAAALocalUserPassword$text"].value==formele["rlAAALocalUserPassword$confirm"].value)
{
if( isPasswordChanged )
formele["rlAAALocalUserPassword$query"].value="$"+formele["rlAAALocalUserPassword$text"].value
else
formele["rlAAALocalUserPassword$query"].disabled = true;
if (formele["removeUser"].checked==true)
{
formele["rlAAALocalHostStatus$query"].value=6;
}
else
{
formele["rlAAALocalUserPrivilage$query"].value=formele["rlAAALocalUserPrivilage$select"].options[formele["rlAAALocalUserPrivilage$select"].selectedIndex].text;
}
disableHtml();
formele["restoreUrl"].value="";
document.secDBForm.submit();
}
else
{
alert("Password and Confirm Password must be identical!");
return false;
}
}
}
function disableHtml()
{
var formele=document.secDBForm.elements;
formele["rlAAALocalUserName$select"].disabled=true;
formele["rlAAALocalUserPrivilage$select"].disabled=true;
formele["rlAAALocalUserPassword$text"].disabled=true;
formele["rlAAALocalUserPassword$confirm"].disabled=true;
formele["removeUser"].disabled=true;
}
function checkPasswordValidity()
{
var formele=document.secDBForm.elements;
e=window.event;
var fldName=e.srcElement.name;
var val=formele[fldName].value;
if ( val=="" || val=="\t" || val==" " || val=="\n")
{
alert("You must supply a Password!");
}
else if (val.length>64)
{
alert ("Password must be up to 64 characters!");
}
else if ( (fldName.indexOf("confirm")==0) && (val!=formele["rlAAALocalUserPassword$text"].value) )
{
alert ("Password and Confirm Password must be identical!");
}
}
function selectQuery(theName)
{
document.location.href="sec_db.htm?Query:rlAAALocalUserName="+adjustStringToQuery(theName);
}
function updateScreen()
{
var formele=document.secDBForm.elements;
if (formele["rlAAALocalUserName$select"].options.length==0)
{
formele["rlAAALocalUserName$select"].disabled=true;
formele["rlAAALocalUserPrivilage$select"].disabled=true;
formele["rlAAALocalUserPassword$text"].value="";
formele["rlAAALocalUserPassword$text"].disabled=true;
formele["rlAAALocalUserPassword$confirm"].value="";
formele["rlAAALocalUserPassword$confirm"].disabled=true;
formele["removeUser"].disabled=true;
}
else indexSign("rlAAALocalUserName$select");
}
function displayPasswordRange()
{
document.write("Password ("+passwordMinVal+"-64 Characters)");
}
function checkPasswordValidation(fieldName)
{
checkValidation('Password','',fieldName,true,'STRING',passwordMinVal,64);
}
// --End of Java code -->
</script>
