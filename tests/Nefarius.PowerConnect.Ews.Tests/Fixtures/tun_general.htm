<script language="JavaScript">
<!-- Beginng of JavaScript Applet
if(top.MonitorMode)
{
document.write("<link rel='stylesheet' href='../device/monitorMode.css' type='text/css'>")
}
var JumboSupported=false;
function formSubmit()
{
formele=document.TuningGeneralForm.elements;
if (formele["rlJumboFramesStatusAfterReset"].selectedIndex == 0)
alert("Jumbo frame support will be functional only after resetting the device.");
disableHtml();
document.TuningGeneralForm.submit();
}
function disableHtml()
{
formele=document.TuningGeneralForm.elements;
if(JumboSupported==true)
{
fieldName = "rlJumboFramesStatusAfterReset";
var changed = isChanged(formele[fieldName]);
if(changed==false)
{
formele["rlJumboFramesStatusAfterReset"].disabled=true;
}
}
}
function checkValue(fieldName)
{
var formele=document.TuningGeneralForm.elements;
var max,min;
if(fieldName=="rlSyslogCacheSizeAfterReset")
{
max = 400;
min = 20;
}
else
{
min = 0;
max = formele["dot1qMaxSupportedVlans"].value;
}
checkValidation('','',fieldName,'','INT',min,max)
}
function displayJumbo()
{
formele=document.TuningGeneralForm.elements;
switch (formele["rlJumboFramesCurrentStatus"].value)
{
case "1":
document.write("Enabled");
break;
case "2":
document.write("Disabled");
break;
}
}
function displaySwitchMode()
{
formele=document.TuningGeneralForm.elements;
var slct = formele["slctSwitchMode"];
var switchModeBits = formele["rlDependendFeaturesEnabledAfterReset"].value;
if(switchModeBits.charAt(1)=="1" && switchModeBits.charAt(2)=="0")
{
document.getElementById("lblSwitchMode").innerHTML = "DVA&amp;iSCSI";
slct.selectedIndex = 1;
}
else if(switchModeBits.charAt(1)=="0" && switchModeBits.charAt(2)=="1")
{
document.getElementById("lblSwitchMode").innerHTML = "ACL&amp;iSCSI";
slct.selectedIndex = 0;
}
}
// --End of Java code -->
</script>
