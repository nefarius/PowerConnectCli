<script language="JavaScript">
<!-- Beginng of JavaScript Applet

document.write("<link rel='stylesheet' href='../device/monitorMode.css' type='text/css'>")
}
top.FirstTd=0;
win_class = "port_mirror"; opener_top = top; listWindow(opener_top, win_class);
var currIndex=0;
var rawNo=1;
FieldsToCheck = new Array(5);
FieldsToCheck[ 0] = "portCopySource$repeat";
FieldsToCheck[ 1] = "portCopyDest$repeat";
FieldsToCheck[ 2] = "portCopyDirection$repeat";
FieldsToCheck[ 3] = "portCopyStatus$repeat";
FieldsToCheck[ 4] = "PortMirror$endRepeat";
function formSubmit()
{
disableHtml();
DisableUnchanged(document.portMirrorForm,"portCopySource$repeat",FieldsToCheck);
document.portMirrorForm.submit();
}
function ChangeStatus(rawNo)
{
formele=document.portMirrorForm.elements;
var CurrentRaw=rawNo;
CurrentBox="CBox_"+CurrentRaw;
if (formele[CurrentBox].checked==true)
formele["portCopyStatus$repeat?"+CurrentRaw].value=6;
else
formele["portCopyStatus$repeat?"+CurrentRaw].value=1;
}
function checkPort()
{
formele=document.portMirrorForm.elements;
e=window.event;
var fldName=e.srcElement.name;
if (!isPresentPort(formele[fldName].value))
{
str=formele[fldName].value+" is not a valid port.";
alert(str);
formele[fldName].focus();
}
}
function loopIndex(index){
currIndex=index;
}
function disableHtml()
{
formelem=document.portMirrorForm.elements;
for (i=1;i<currIndex+1;i++)
{
formelem["CBox_"+i].disabled=true;
}
formelem["rlPhDPortsIfIndex$select"].disabled=true;
}
function DisplayPortCopyStatus(ind)
{
var value = document.portMirrorForm.elements["portCopyStatus$repeat?"+ind].value;
var StatusText = "";
switch(value)
{
case "1":
StatusText = "active";
break;
case "2":
StatusText = "notInService";
break;
case "3":
StatusText = "notReady";
break;
case "4":
StatusText = "createAndGo";
break;
case "5":
StatusText = "createAndWait";
break;
case "6":
StatusText = "destroy";
break;
default:
}
document.write(StatusText);
}
function DisplayPortCopySource(ind)
{
var value = document.portMirrorForm.elements["portCopySource$repeat?"+ind].value;
var SourceText = "";
SourceText = getPortNameFromNumber(value);
document.write(SourceText);
}
function submitQuery()
{
var selectName = document.portMirrorForm.elements["rlPhDPortsIfIndex$select"];
var newFilter="port_mirror.htm?[PortMirror]Filter:portCopyDest=";
newFilter+=selectName.options[selectName.selectedIndex].value;
filterString=newFilter;
top.portCopyDest = selectName.options[selectName.selectedIndex].value;
document.location.href=filterString;
}
function indexSign(){
var i=0;
formele=document.forms[0].elements;
selectName=formele["rlPhDPortsIfIndex$select"];
var restore_url = formele["restoreUrl"].value;
var place = restore_url.indexOf("=");
var if_index = restore_url.substring(place + 1);
while (selectName.options[i]!=null)
{
if (selectName.options[i].value == if_index)
{
selectName.selectedIndex=i;
break;
}
i++;
}
}
function activateFilter(){
var formele=document.portMirrorForm.elements;
var dest_port = formele["portCopyDest$query"].value;
var newFilter="port_mirror.htm?[PortMirror]Filter:portCopyDest=";
if (!isNaN(parseInt(dest_port)))
{
newFilter += dest_port;
top.portCopyDest = dest_port;
}
else
{
newFilter += "1";
top.portCopyDest = 1;
}
document.location.href=newFilter;
}
function checkHref()
{
var restore_url = document.portMirrorForm.restoreUrl.value;
if (restore_url.indexOf("[PortMirror]Filter") != -1)
return true;
return false;
}
function checkFirstFilter()
{
if (!checkHref())
{
return activateFilter();
}
}
function fillDestinationPortSelect() {
var formele=document.portMirrorForm.elements;
var newOption;
var destPortSelect = formele["rlPhDPortsIfIndex$select"];
var destPort = document.getElementsByName("portCopyDest$repeat?1")[0];
if (destPort) {
var val = getPortNameFromNumber(destPort.value);
newOption = new Option(val, destPort.value);
destPortSelect.options[0] = newOption;
top.portCopyDest = destPort.value;
} else {
addPresentPortsSelectionList(document.portMirrorForm,'rlPhDPortsIfIndex$select',1,'n');
indexSign();
}
}
// --End of Java code -->
