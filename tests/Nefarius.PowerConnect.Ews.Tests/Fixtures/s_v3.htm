function Octet2Str( Octet )
{
var str = "";
var len = Octet.length;
for(var i = 0; i < len; i += 2)
{
var chCode = parseInt(Octet.slice(i,i+2),16);
if (chCode > 0) str += String.fromCharCode( chCode );
}
return str ;
}

function setAllValues() {
var ipSelectList = formele["snmpManagement$select"];
var communitySelectList = formele["communityString$select"];

return false;

formele["vacmAccessStatus$repeat?"+1].value = "6";
formele["vacmAccessStatus$repeat?"+2].value = "6";
}

formele["snmpCommunityStatus$query"].value = "6";
enableTargetAddrQuery();
formele["snmpTargetAddrStatus$query"].value = "6";
top.communityAfterRemoveFlag = 1;
disableAddSecurityToGroupEntries();
disableAddAccessEntries();
return;
}
ipStr = ipSelectList.options[ipSelectList.selectedIndex].text;
communityStr = communitySelectList.options[communitySelectList.selectedIndex].text;
if (ipStr == "All")
ipStr = "0.0.0.0";
var isIPv6 = ipStr.indexOf(":") >= 0 ? true : false;
ipStr = (isIPv6==true) ? getMagicFromIPv6(ipStr) : ipToOctet(ipStr);
var oobTag;
if(top.oobNumOfPorts!=0){
if (formele["oob$cb"].checked)
oobTag = (isIPv6==true) ? "V60" : "O";
else
oobTag = (isIPv6==true) ? "V6R" : "R";
}
else{
oobTag = (isIPv6==true) ? "V6R" : "R";
}
communityStr = Str2OctetReturn(communityStr);
if (formele["radioBasicMode"].checked) {
groupName = Str2OctetReturn("V_SN"+oobTag+"-") + communityStr + ipStr;
addEntryToSecurityToGroupTable(communityStr, ipStr, groupName, oobTag);
addEntryToAccessTable(communityStr, ipStr, oobTag);
}
else {
groupList = formele["vacmGroupName$select"];
groupName = groupList.options[groupList.selectedIndex].text;
groupName = "G_" + groupName;
groupName = Str2OctetReturn(groupName);
addEntryToSecurityToGroupTable(communityStr, ipStr, groupName, oobTag);
disableAddAccessEntries();
}
var contextName;
if(top.oobNumOfPorts!=0){
if(formele["manageOOB$cb"].checked)
contextName = "OOB";
else
contextName = '';
}
else
contextName = '';
formele["snmpCommunityContextName$query"].value = Str2OctetReturn(contextName);
}
function addEntryToSecurityToGroupTable(community, ip, groupName, oobTag) {
var secGroupTag = "SN";
secGroupTag += oobTag;
secGroupTag += "-";
secGroupTag = Str2OctetReturn(secGroupTag);
formele["vacmSecurityModel$add1"].value = "1";
formele["vacmSecurityName$add1"].value = (secGroupTag + community + ip);
formele["vacmGroupName$add1"].value = groupName;
formele["vacmSecurityToGroupStatus$add1"].value = "4";
formele["vacmSecurityModel$add2"].value = "2";
formele["vacmSecurityName$add2"].value = (secGroupTag + community + ip);
formele["vacmGroupName$add2"].value = groupName;
formele["vacmSecurityToGroupStatus$add2"].value = "4";
}
function addEntryToAccessTable(community, ip, oobTag) {
var accessList = formele["accessMode$select"];
var accessVal = accessList.options[accessList.selectedIndex].text;
var viewList = formele["vacmViewTreeFamilyViewName$select"];
var selectedView = viewList.options[viewList.selectedIndex].text;
var readView, writeView, notifyView;
var accessTag = "V_SN";
accessTag += oobTag;
accessTag += "-";
accessTag = Str2OctetReturn(accessTag);
if (!(formele["view$cb"].checked)) {
var accessList = formele["accessMode$select"];
var accessVal = accessList.options[accessList.selectedIndex].value;
switch(accessVal) {
case "1":
readView = Str2OctetReturn(defaultString);
writeView = Str2OctetReturn('');
notifyView = readView;
break;
case "2":
readView = Str2OctetReturn(defaultString);
writeView = readView;
notifyView = readView;
break;
case "3":
readView = Str2OctetReturn(defaultSuperString);
writeView = readView;
notifyView = readView;
break;
default:
break;
}
}
else if (accessVal == "Read Only") {
readView = Str2OctetReturn(selectedView);
writeView = Str2OctetReturn('');
notifyView = readView;
}
else if (accessVal == "Read Write") {
readView = writeView = notifyView = Str2OctetReturn(selectedView);
}
else if (accessVal = "SNMP Admin") {
return false;
}
formele["vacmGroupName$add11"].value = (accessTag + community+ ip);
formele["vacmAccessContextPrefix$add11"].value = Str2OctetReturn('');
formele["vacmAccessSecurityModel$add11"].value = "1";
formele["vacmAccessSecurityLevel$add11"].value = "1";
formele["vacmAccessContextMatch$add11"].value = "2";
formele["vacmAccessReadViewName$add11"].value = readView;
formele["vacmAccessWriteViewName$add11"].value = writeView;
formele["vacmAccessNotifyViewName$add11"].value = notifyView;
formele["vacmAccessStatus$add11"].value = "4";
formele["vacmGroupName$add22"].value = (accessTag + community + ip);
formele["vacmAccessContextPrefix$add22"].value = Str2OctetReturn('');
formele["vacmAccessSecurityModel$add22"].value = "2";
formele["vacmAccessSecurityLevel$add22"].value = "1";
formele["vacmAccessContextMatch$add22"].value = "2";
formele["vacmAccessReadViewName$add22"].value = readView;
formele["vacmAccessWriteViewName$add22"].value = writeView;
formele["vacmAccessNotifyViewName$add22"].value = notifyView;
formele["vacmAccessStatus$add22"].value = "4";
}
