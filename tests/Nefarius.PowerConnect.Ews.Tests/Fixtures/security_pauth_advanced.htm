<!-- Beginng of JavaScript Applet

var fonsecaProj="FONSECA";

function formSubmit()
{
document.secPAuthAdvForm.elements["ifIndex$select"].disabled=true;
document.secPAuthAdvForm.submit();
}
function checkHref()
{
var formele=document.secPAuthAdvForm.elements;
var currentURL=formele["restoreUrl"].value;
if (currentURL.indexOf("Query:")!= -1)
return true;
return false;
}
function checkFirstFilter()
{
var formele=document.secPAuthAdvForm.elements;
if (!checkHref())
{
var queryString="security_pauth_advanced.htm?[secPAuthAdvTable]Query:ifIndex="+formele["ifIndex$select"].options[formele["ifIndex$select"].selectedIndex].value;
document.location.href=queryString;
return true;
}
return false;
}
function openShowAllWindow()
{
if(top.Units==true)
{
window.open('advanced_authen_table.htm?Filter:((rlPhdPortsModuleNumber=1)&&(ifOperStatus!=6))','', 'width=850, height=600, left=50, top=50, scrollbars=yes, resizable=yes');
}
else
{
window.open('advanced_authen_table.htm?Filter:(ifOperStatus!=6&&ifIndex<='+parseInt(top.NumberOfPorts)+')','', 'width=850, height=600, left=50, top=50, scrollbars=yes, resizable=yes');
}
}
function displayStatus()
{
formele=document.secPAuthAdvForm.elements;
status="";
if (formele["swIfHostMode$query"].value!="1")
{
document.write("No Single-host");
return;
}
if ((formele["ifOperStatus$query"].value=="1")&&
(formele["dot1xAuthAuthControlledPortStatus$query"].value=="1"))
{
if (formele["dot1xAuthAuthControlledPortControl$query"].value=="2")
status="Single-host locked";
else
status="Not in auto mode";
}
else status="Unauthorized";
document.write(status);
}
function changeFieldsState(){
var formele=document.secPAuthAdvForm.elements;
var hostMode = formele["swIfHostMode$query"].value;
if(hostMode==1){
formele["swIfSingleHostViolationAdminAction$query"].disabled=false;
formele["swIfSingleHostViolationAdminTrapEnable$query"].disabled=false;
formele["swIfSingleHostViolationAdminTrapFrequency$query"].disabled=false;
}
else{
formele["swIfSingleHostViolationAdminAction$query"].selectedIndex = defaultActionIndex;
formele["swIfSingleHostViolationAdminAction$query"].disabled=true;
formele["swIfSingleHostViolationAdminTrapEnable$query"].selectedIndex = defaultTrapEnableIndex;
formele["swIfSingleHostViolationAdminTrapEnable$query"].disabled=true;
formele["swIfSingleHostViolationAdminTrapFrequency$query"].value = defaultTrapFrequency;
formele["swIfSingleHostViolationAdminTrapFrequency$query"].disabled=true;
}
changeTrapsState();
}
function changeTrapsState()
{
var formele=document.secPAuthAdvForm.elements;
if (!formele["swIfSingleHostViolationAdminTrapEnable$query"].disabled)
{
if (formele["swIfSingleHostViolationAdminTrapEnable$query"].selectedIndex==0)
formele["swIfSingleHostViolationAdminTrapFrequency$query"].disabled=false;
else formele["swIfSingleHostViolationAdminTrapFrequency$query"].disabled=true;
}
else formele["swIfSingleHostViolationAdminTrapFrequency$query"].disabled=true;
}
var defaultActionIndex;
var defaultTrapEnableIndex;
var defaultTrapFrequency;
function saveDefaults(){
var formele=document.secPAuthAdvForm.elements;
defaultActionIndex = formele["swIfSingleHostViolationAdminAction$query"].selectedIndex;
defaultTrapEnableIndex = formele["swIfSingleHostViolationAdminTrapEnable$query"].selectedIndex;
defaultTrapFrequency = formele["swIfSingleHostViolationAdminTrapFrequency$query"].defaultValue;
}
// --End of Java code -->
