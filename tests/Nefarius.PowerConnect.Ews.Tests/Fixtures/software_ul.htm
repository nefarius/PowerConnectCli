function trimWhitespaces(str) {
if (str != "") {
str = str.split(/^[^\S]*/i);
str = str[str.length - 1];
str = str.split(/[^\S]*$/i)[0];
}
return str;
}
function checkIPAddress(ipAddressString) {
if (/^(\d{1,3}\.){3}\d{1,3}\s*$/.test(ipAddressString)) {
var octets = ipAddressString.split(".");
var i = octets.length;
while ((i > 0) && (parseInt(octets[--i]) < 256));
return i == 0;
} else {
return false;
}
}
function disableTextControl(control) {
control.disabled = true;
control.style.backgroundColor = "#CCC";
}
function enableTextControl(control) {
control.disabled = false;
control.style.backgroundColor = "#FFF";
}
function disableTabControls(tab) {
var c = tab.getElementsByTagName("input");
var i = c.length;
while (i-- > 0) {
switch (c[i].type) {
case "text":
disableTextControl(c[i]);
break;
case "file":
disableTextControl(c[i]);
break;
default:
c[i].disabled = true;
}
}
c = tab.getElementsByTagName("select");
i = c.length;
while (i-- > 0) {
disableTextControl(c[i]);
}
c = tab.getElementsByTagName("textarea");
i = c.length;
while (i-- > 0) {
disableTextControl(c[i]);
}
}
function enableTabControls(tab) {
var c = tab.getElementsByTagName("input");
var i = c.length;
while (i-- > 0) {
switch (c[i].type) {
case "text":
enableTextControl(c[i]);
break;
case "file":
enableTextControl(c[i]);
break;
default:
c[i].disabled = false;
}
}
c = tab.getElementsByTagName("select");
i = c.length;
while (i-- > 0) {
enableTextControl(c[i]);
}
c = tab.getElementsByTagName("textarea");
i = c.length;
while (i-- > 0) {
enableTextControl(c[i]);
}
}
function setProtocol() {
var tftpRadio = document.getElementById("tftpRadio");
var httpRadio = document.getElementById("httpRadio");
if (tftpRadio.checked) {
document.getElementById("tftpConfigurationDestinationFileName").value = "";
enableTabControls(document.getElementById("configurationTab"));
}
if (httpRadio.checked) {
document.getElementById("tftpConfigurationDestinationFileName").value = "stupCfg.ber";
disableTabControls(document.getElementById("configurationTab"));
}
}
function isValidIP(ipAdd)
{
if(ipAdd=="0.0.0.0" || ipAdd=="255.255.255.255" || ipAdd=="127.0.0.1")return false;
var val=ipAdd.split(".");
if((parseInt(val[0])>=224) && (parseInt(val[0])<=239))
return false;
return true;
}
function checkConfigurationUploadInput() {
if (document.getElementById("tftpRadio").checked) {
var ipAddressField = document.getElementById("tftpConfigurationIpAddress");
var fileNameField = document.getElementById("tftpConfigurationDestinationFileName");
var inputCorrect = true;
if (/^\s*$/.test(ipAddressField.value) ) {
alert("You must enter TFTP server IP address.");
ipAddressField.focus();
inputCorrect = false;
} else {
if (!checkIPAddress(ipAddressField.value) || !isValidIP(ipAddressField.value)) {
alert("You must enter correct IP address.");
ipAddressField.focus();
inputCorrect = false;
}
}
if (inputCorrect && /^\s*$/.test(fileNameField.value)) {
alert("You must enter file name.");
fileNameField.focus();
inputCorrect = false;
}
return inputCorrect;
} else {
return true;
}
}
function showUI() {
document.body.style.visibility = "visible";
}
function notifyTransferInProgress() {
alert("Another file transfer in progress. Upload page can not be used until file transfer ends.");
top.location.reload();
}
function notifyDataLoaded() {
showUI();
}
function pageUnloadListener() {
userInput.enable();
}
if ("addEventListener" in document) {
window.addEventListener("unload", pageUnloadListener, false);
} else {
window.attachEvent("onunload", pageUnloadListener);
}
function startOperation() {
var tftpRadio = document.getElementById("tftpRadio");
var httpRadio = document.getElementById("httpRadio");
if (checkConfigurationUploadInput()) {
if (tftpRadio.checked) {
var fileType = 6;
mibData.setValue("rlCopyIndex$Add", 1);
mibData.setValue("rlCopySourceLocation$Add", 1);
mibData.setValue("rlCopySourceFileType$Add", fileType);
mibData.setValue("rlCopyDestinationLocation$Add", 3);
mibData.setValue("rlCopyDestinationIpAddress$Add", document.getElementById("tftpConfigurationIpAddress").value);
mibData.setValue("rlCopyDestinationFileName$Add", document.getElementById("tftpConfigurationDestinationFileName").value);
mibData.enableField("rlcopyTableVT");
mibData.enableField("rlCopyTable$VT");
mibData.enableField("rlCopyIndex$VT");
mibData.enableField("rlCopySourceLocation$VT");
mibData.enableField("rlCopySourceFileType$VT");
mibData.enableField("rlCopyDestinationLocation$VT");
mibData.enableField("rlCopyDestinationIpAddress$VT");
mibData.enableField("rlCopyDestinationFileName$VT");
mibData.enableField("rlCopyRowStatus$VT");
mibData.enableField("rlCopyHistoryIndex$VT");
mibData.enableField("rlcopyTableVT$endVT");
mibData.setValue("rlCopyRowStatus$Add", "4");
mibData.setValue("rlCopyHistoryIndex$Add", mibData.getValue("rlCopyFreeHistoryIndex$scalar"));
mibData.enableField("rlcopyTableVT$endAdd");
mibData.sendData();
infoPopup.show("/config/copy_history_status.htm?[rlCopyHistoryTableVT]Query:rlCopyHistoryHistoryIndex=1");
}
if (httpRadio.checked) {
var fileType = 6
var fileName = "stupCfg.ber";
var queryStr = fileName + "?rlCopyFreeHistoryIndex="
+ mibData.getValue("rlCopyFreeHistoryIndex$scalar") + "&&rlCopyDestinationFileType=" + fileType;
document.getElementById("dataFrame").contentWindow.location.href = queryStr;
infoPopup.show("/config/copy_history_status.htm?[rlCopyHistoryTableVT]Query:rlCopyHistoryHistoryIndex=1");
}
}
}

<script type="text/javascript">
var userInput = {
framesToDisable: ["up_menu", "logo", "serv_name", "vline", "submenu", "hline", "tree", "main"],
enable: function () {
var i = this.framesToDisable.length;
while (i-- > 0) {
if (window.top[this.framesToDisable[i]].page)
window.top[this.framesToDisable[i]].page.enableUserInput();
}
},
disable: function () {
var i = this.framesToDisable.length;
while (i-- > 0) {
if ( window.top[this.framesToDisable[i]].page )
window.top[this.framesToDisable[i]].page.disableUserInput();
}
}
}
var infoPopup = new (function () {
this._popup = document.getElementById("infoPopup");
var ui = new UI();
this._popupContainer = new ui.Container(this._popup);
this._bodyContainer = new ui.Container(document.body);
this._popupErrorMessage = document.getElementById("errorMessage");
this._popupErrorMessageText = document.getElementById("errorMessageValue");
this._popupCloseButton = document.getElementById("closeButton");
this._popupData = document.createElement("iframe");
this._popupData.ownerPopup = this;
with (this._popupData.style) {
position = "absolute";
visibility = "hidden";
width = "1px";
height = "1px";
left = "-100px";
top = "-100px";
}
document.body.insertBefore(this._popupData, document.body.firstChild);
this._popupErrorMessage.style.display = "none";
this._popupCloseButton.style.display = "none";
this._viewportChangeListener = function () {
var bodyR = this._bodyContainer.getBoundingBox();
var popupR = this._popupContainer.getBoundingBox();
this._popup.style.left = Math.round((bodyR.right - bodyR.left - popupR.right + popupR.left) / 2) + document.body.scrollLeft + "px";
this._popup.style.top = Math.round((bodyR.bottom - bodyR.top - popupR.bottom + popupR.top) / 2) + document.body.scrollTop + "px";
}
var utils = new Utils();
this._viewportChangeListenerTask = new utils.Task(this, this._viewportChangeListener);
this._notifyDataAvailable = function () {
document.getElementById("operationStatusValue").innerHTML = this._popupData.contentWindow.getOperationStateMessage();
document.getElementById("bytesTransferredValue").innerHTML = this._popupData.contentWindow.getBytesTransferred();
if (this._popupData.contentWindow.isOperationFinished()) {
this.showErrorMessage(this._popupData.contentWindow.getErrorMessage());
this.showCloseButton();
}
}
this.show = function (dataURI) {
userInput.disable();
if ("addEventListener" in window) {
window.addEventListener("scroll", this._viewportChangeListenerTask.execute, false);
} else {
window.attachEvent("onresize", this._viewportChangeListenerTask.execute);
window.attachEvent("onscroll", this._viewportChangeListenerTask.execute);
}
this._popup.style.visibility = "hidden";
this._popup.style.display = "block";
this._viewportChangeListener();
this._popup.style.visibility = "visible";
this._popupData.contentWindow.location.replace(dataURI);
}
this.hide = function () {
this.hideErrorMessage();
this.hideCloseButton();
if ("addEventListener" in window) {
window.removeEventListener("scroll", this._viewportChangeListenerTask.execute, false);
} else {
window.detachEvent("onresize", this._viewportChangeListenerTask.execute);
window.detachEvent("onscroll", this._viewportChangeListenerTask.execute);
}
this._popup.style.display = "none";
}
this.showErrorMessage = function (messageText) {
messageText = messageText.split(String.fromCharCode(160)).join(" ");
this._popupErrorMessageText.innerHTML = messageText;
if ("addEventListener" in document) {
this._popupErrorMessage.style.display = "table-row";
} else {
this._popupErrorMessage.style.display = "block";
}
this._viewportChangeListener();
}
this.hideErrorMessage = function () {
this._popupErrorMessage.style.display = "none";
}
this.showCloseButton = function () {
this._popupCloseButton.style.display = "block";
}
this.hideCloseButton = function () {
this._popupCloseButton.style.display = "none";
}
})();
function MIBData(dataFrame) {
this._data = dataFrame;
}
MIBData.prototype.setValue = function (fieldName, fieldValue) {
with (this._data.contentWindow.document.getElementsByName(fieldName)[0]) {
value = fieldValue;
disabled = false;
}
}
MIBData.prototype.getValue = function (fieldName) {
return this._data.contentWindow.document.getElementsByName(fieldName)[0].value;
}
MIBData.prototype.getColumnValues = function (columnName) {
var columnFields = this._data.contentWindow.document.getElementsByName(columnName);
var columnFieldsValues = new Array();
for (var i = 0; i < columnFields.length; ++i) {
columnFieldsValues[i] = columnFields[i].value;
}
return columnFieldsValues;
}
MIBData.prototype.enableField = function (fieldName) {
this._data.contentWindow.document.getElementsByName(fieldName)[0].disabled = false;
}
MIBData.prototype.sendData = function () {
this._data.contentWindow.document.forms[0].submit();
}
var mibData = new MIBData(document.getElementById("dataFrame"));
</script>
