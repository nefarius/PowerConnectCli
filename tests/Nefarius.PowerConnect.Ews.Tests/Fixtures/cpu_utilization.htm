<title>CPU Utilization</title>
<link rel="stylesheet" href="../device/style.css" type="text/css">
<script>
top.inPanel=0;
var mIsChartFrameLoaded = false;
var mRefreshRate = 15000;
var mTimeoutId = 0;
var mData = new Array();
function refreshRateChanged()
{
mRefreshRate = chart_gui.document.PortsChartForm.refresh_rate_select.value;
if( mRefreshRate == -1)
clearInterval( mTimeoutId );
else
mTimeoutId = setTimeout("Polling();", mRefreshRate );
Polling();
}
function resetTimer()
{
if( 0 != mTimeoutId )
clearInterval( mTimeoutId );
}
function Polling()
{
reloadSamples();
try
{
chart_properties.document.location.reload();
}
catch(e)
{
}
if( mRefreshRate != -1 )
mTimeoutId = setTimeout("Polling();", mRefreshRate );
}
function reloadSamples()
{
var i=0;
var length = mData.length;
try
{
if( null != chart_gui.document.applets['GRAPH'] )
for( i = 0; i < length; i++ )
chart_gui.document.applets['GRAPH'].set_datavalue(i,0,mData[i], true);
}
catch(e)
{
}
}
</script>
