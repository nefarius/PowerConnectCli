<script language="JavaScript">
<!-- Beginng of JavaScript Applet
if(top.MonitorMode) {
document.write("<link rel='stylesheet' href='../device/monitorMode.css' type='text/css'>")
}
var engineIdWasOn = false;
var defaultEngineWasOn = false;
var engineNotConfiguredString = "EngineID not Configured";
function elementByName(name) {
return document.getElementsByName(name)[0];
}
function setControlValue(control, value) {
control.disabled = false;
control.value = value;
}
function enableControl(ctrl){
ctrl.disabled = false;
ctrl.style.backgroundColor="#ffffff";
}
function disableControl(ctrl){
ctrl.disabled = true;
ctrl.style.backgroundColor="#cccccc";
}
function initForm(){
var snmpModeSelect = document.getElementById("snmpModeSelect");
var authenModeSelect = document.getElementById("authenModeSelect");
snmpModeSelect.value = elementByName("rndAlarmEnabling$scalar").value;
if(snmpModeSelect.value == "2") {
authenModeSelect.value = "2";
authenModeSelect.disabled = true;
} else {
authenModeSelect.value = elementByName("snmpEnableAuthenTraps$scalar").value;
}
}
function changeSnmpModeSelect(value) {
var authenModeSelect = document.getElementById("authenModeSelect");
if(value == "2") {
authenModeSelect.disabled = true;
authenModeSelect.value = "2";
} else {
authenModeSelect.disabled = false;
authenModeSelect.value = "1";
}
}
function formSubmit() {
var snmpMode = document.getElementById("snmpModeSelect").value;
var authenMode = document.getElementById("authenModeSelect").value;
var snmpModeCtrl = elementByName("rndAlarmEnabling$scalar");
var authenModeCtrl = elementByName("snmpEnableAuthenTraps$scalar");
if(snmpMode != snmpModeCtrl.value) {
setControlValue(snmpModeCtrl, snmpMode);
}
if(authenMode != authenModeCtrl.value) {
setControlValue(authenModeCtrl, authenMode);
}
document.snmpGlobalForm.submit();
}
// --End of Java code -->
</script>

<INPUT  type="hidden" name=snmpEnableAuthenTraps$scalar disabled   value="1" SIZE="20" MAXLENGTH="20">
</form>
