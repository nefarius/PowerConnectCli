<script language="JavaScript">
<!-- Beginng of JavaScript Applet
if(top.MonitorMode) {
document.write("<link rel='stylesheet' href='../device/monitorMode.css' type='text/css'>")
}
top.FirstTd=0;
FieldsToCheck = new Array(3);
FieldsToCheck[0] = "rlQosCosIndex$repeat";
FieldsToCheck[1] = "rlQosCosQueueId$repeat";
FieldsToCheck[2] = "QosCosQueueTable$endRepeat";
var defValuesArr;
var saveStateArr=new Array();;
var Qnum;
function formSubmit()
{
var COSNum=1;
var formele=document.cosqosToForm.elements;
while (formele["rlQosCosQueueId$select?"+COSNum]!=null)
{
formele["rlQosCosQueueId$repeat?"+COSNum].value=parseInt(formele["rlQosCosQueueId$select?"+COSNum].options[formele["rlQosCosQueueId$select?"+COSNum].selectedIndex].text);
COSNum++;
}
disableHtml();
DisableUnchanged(document.cosqosToForm,FieldsToCheck[0],FieldsToCheck);
document.cosqosToForm.submit();
}
function disableHtml()
{
var COSNum=1;
var formele=document.cosqosToForm.elements;
while (formele["rlQosCosQueueId$select?"+COSNum]!=null)
{
formele["rlQosCosQueueId$select?"+COSNum].disabled=true;
COSNum++;
}
formele["defCkbx"].disabled=true;
}
function disableQueueHtmlControls(action)
{
var COSNum=1;
var state;
var formele=document.cosqosToForm.elements;
if(action == true)
state = false;
else
state = true;
while (formele["rlQosCosQueueId$select?"+COSNum]!=null)
{
if(formele["rlQosCosQueueId$select?"+COSNum].disabled == state)
formele["rlQosCosQueueId$select?"+COSNum].disabled=action;
COSNum++;
}
}
function setDefValues()
{
var COSNum=1;
var formele=document.cosqosToForm.elements;
if (formele["defCkbx"].checked==true)
{
disableQueueHtmlControls(true);
while (formele["rlQosCosQueueId$select?"+COSNum]!=null)
{
formele["rlQosCosQueueId$select?"+COSNum].selectedIndex=defValuesArr[COSNum-1]-1;
COSNum++;
}
}
else
{
disableQueueHtmlControls(false);
while (formele["rlQosCosQueueId$select?"+COSNum]!=null)
{
formele["rlQosCosQueueId$select?"+COSNum].selectedIndex=saveStateArr[COSNum-1]-1;
COSNum++;
}
}
}
function Change(COSNum)
{
var formele=document.cosqosToForm.elements;
if (window.event && window.event.srcElement && window.event.srcElement.name)
{
e=window.event;
fldName=e.srcElement.name;
}
else if (!window.event)
{
e=arguments.callee.caller.arguments[0];
fldName=e.target.name ;
}
saveStateArr[COSNum-1]=parseInt(formele[fldName].options[formele[fldName].selectedIndex].text);
}
function writeCosToQ(COSNum)
{
var formObj=document.cosqosToForm;
var selectName="rlQosCosQueueId$select?"+COSNum;
var selectedVal=parseInt(formObj.elements["rlQosCosQueueId$repeat?"+COSNum].value);
saveStateArr[COSNum-1]=selectedVal;
var classID=formObj.elements["rlQosCosIndex$repeat?"+COSNum].value;
document.write("<tr>");
document.write("<td nowrap style='WIDTH: 10px' class='data-area-canvas'>&nbsp;</td>");
document.write("<td nowrap class='"+colorClass()+"'>"+classID+"</td>");
document.write("<td nowrap class='"+colorClass()+"'>");
document.write("<select name='"+selectName+"'onChange='Change("+COSNum+")'>");
document.write("<option value=' '></option></select>");
addRangeSelectionList(formObj,selectName,1,Qnum,"",selectedVal);
document.write("</td>");
document.write("<td nowrap class='data-area-canvas'>&nbsp;</td>");
document.write("<td nowrap style='WIDTH: 15px'>&nbsp;</td>");
document.write("</tr>");
ChangeRowColor();
}
// --End of Java code -->
</script>
