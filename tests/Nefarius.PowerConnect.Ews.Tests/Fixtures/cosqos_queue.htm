<script language="JavaScript">
<!-- Beginng of JavaScript Applet
if(top.MonitorMode) {
document.write("<link rel='stylesheet' href='../device/monitorMode.css' type='text/css'>")
}
top.FirstTd=0;
var NumOfEntries=0;
var numOfQueues=top.numOfQueues;
var defaultWeights = [NaN, "1", "2", "8", "16", "32", "64", "128", "255"];
function formSubmit() {
var index;
for (index=1; index<=numOfQueues; index++) {
formele["rlQosEfQueueId$repeat?"+index].disabled=false;
formele["rlQosEfState$repeat?"+index].disabled=false;
formele["EfManageTable$endrepeat?"+index].disabled=false;
}
var weightField;
for (i=1; i<=numOfQueues; i++) {
weightField = document.getElementById("weight" + i);
if (weightField.disabled) continue;
if ( !checkWeight(weightField, i, i == 8 ? 1 : 0, 255, false) )
return false;
formele["rlQosValueQueue" + i + "$query"].disabled = weightField.disabled;
formele["rlQosValueQueue" + i + "$query"].value = weightField.value;
}
for (i = 5; i <= 8; i++)
formele["rlQosValueQueue"+i+"$query"].disabled = formele["rlQosValueQueue1$query"].disabled;
document.cosqosQueueForm.submit();
}
function drawQueueTable() {
var index = 1;
var radioName;
var sspRadioId;
var wrrRadioId;
var percentId
var qid;
var sspDisabled;
var wrrDisabled;
var sspChecked;
var wrrChecked;
var minRange;
var weightField;
while (formele["rlQosEfQueueId$repeat?" + index]) {
NumOfEntries = index;
radioName = "queueModeRadio" + index;
sspRadioId = "sspRadio" + index;
wrrRadioId = "wrrRadio" + index;
percentId = "percentTd" + index;
qid = formele["rlQosEfQueueId$repeat?" + index].value;
sspDisabled = (index == 2) ? " disabled " : "";
wrrDisabled = (index == 1) ? " disabled " : "";
if (formele["rlQosEfState$repeat?" + index].value == "1") {
wrrChecked = " checked ";
sspChecked = "";
} else {
wrrChecked = "";
sspChecked = " checked ";
}
minRange = (index == 8) ? 1 : 0;
document.write("<tr>");
document.write(" <td nowrap style='width: 10px' class='data-area-canvas'>&nbsp;</td>");
document.write(" <td nowrap class='" + colorClass() + "' align='left'>"+ qid +"</td>");
document.write(" <td nowrap class='" + colorClass() + "' align='left'>");
document.write(" <input type='radio' name='" + radioName +"' id='"+ sspRadioId + "'" + sspDisabled + sspChecked);
document.write(" onClick='changeQueueStatus(" + index + ");displayPrecent();'>");
document.write(" </td>");
document.write(" <td nowrap class='" + colorClass() + "' align='left'>");
document.write(" <input type='radio' name='" + radioName + "' id='" + wrrRadioId + "'" + wrrDisabled + wrrChecked);
document.write(" onClick='changeQueueStatus(" + index + ");displayPrecent();'>");
document.write(" </td>");
document.write(" <td align='center' nowrap valign='middle' class=" + colorClass() + ">");
document.write(" <input type='text' size=20 id='weight" + index + "' onBlur=\"checkWeight(this," + index + "," + minRange + ",255, true);displayPrecent();\" size=3 id='weight" + index + "'>");
document.write(" </td>");
document.write(" <td align='center' id='" + percentId + "' nowrap valign='middle' class=" + colorClass() + ">&nbsp;</td>");
document.write(" <td nowrap class='data-area-canvas'>&nbsp;</td>");
document.write(" <td nowrap style='width: 15px'>&nbsp;</td>");
document.write("</tr>");
ChangeRowColor();
index ++;
}
}
function setValues() {
var weightField;
for (var i=1; i<=numOfQueues; i++) {
weightField = document.getElementById("weight" + i);
if (formele["rlQosEfState$repeat?"+i].value == "1") {
weightField.value = formele["rlQosValueQueue" + i + "$query"].value;
} else {
weightField.value = "";
weightField.disabled = true;
}
}
}
function displayPrecent() {
var weight;
var sum = calcSum();
var td;
for (var i=1; i<=numOfQueues; i++) {
td = document.getElementById("percentTd" + i);
if (!document.getElementById("weight" + i).disabled) {
weight = parseInt(document.getElementById("weight" + i).value);
if (sum == 0)
td.innerHTML = "";
else
td.innerHTML = Math.round((weight/sum) * 10000)/100;
} else {
td.innerHTML="";
}
}
}
function calcSum() {
var sum = 0;
var weightCtrl;
for (i=1; i<=numOfQueues; i++) {
weightCtrl = document.getElementById("weight" + i);
if (!weightCtrl.disabled) {
sum += parseInt(weightCtrl.value);
}
}
return sum;
}
function changeQueueStatus(index) {
var i;
var weightField;
for (var i=1; i<=NumOfEntries; i++) {
weightField = document.getElementById("weight" + i);
if(weightField.value != "") {
defaultWeights[i] = weightField.value;
}
}
var sspRadio = document.getElementById("sspRadio" + index);
if(sspRadio.checked) {
for (i=index; i<=NumOfEntries; i++) {
formele["rlQosEfState$repeat?"+i].value = "2";
document.getElementById("sspRadio" + i).checked = true;
weightField = document.getElementById("weight" + i);
weightField.value = "";
weightField.disabled = true;
}
} else {
for (i=1; i<=index; i++) {
document.getElementById("wrrRadio" + i).checked = true
formele["rlQosEfState$repeat?"+i].value = "1";
weightField = document.getElementById("weight" + i);
weightField.value = defaultWeights[i];
weightField.disabled = false;
}
}
}
function checkWeight(ctrl, index, min, max, show_alert) {
if(ctrl.value == "" || ctrl.value == " ") {
if ( show_alert )
alert("Blank value for weight is not allowed!");
ctrl.value = defaultWeights[index];
ctrl.select();
return false;
}
if (!checkInteger(ctrl.value)) {
if ( show_alert )
alert("Weight is not valid integer value");
ctrl.value = defaultWeights[index];
ctrl.select();
return false;
}
var intVal = parseInt(ctrl.value);
if (intVal == NaN || intVal < min || intVal > max) {
if ( show_alert )
alert("Weight must lay inside range [" + min + "," + max + "]");
ctrl.value = defaultWeights[index];
ctrl.select();
return false;
}
else
ctrl.value = intVal;
return true;
}
// --End of Java code -->
</script>
