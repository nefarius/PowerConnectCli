name: .NET

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results
          path: "**/*.trx"

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-report
          path: "TestResults/**/coverage.cobertura.xml"

      - name: Pack
        run: dotnet pack -c Release --no-build -o artifacts

      - name: Upload NuGet packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nuget-packages
          path: artifacts/*.nupkg

      - name: Publish linux-x64
        if: success() && startsWith(github.ref, 'refs/tags/v')
        run: dotnet publish cli/pc28xx/pc28xx.csproj -c Release -r linux-x64 --self-contained -p:PublishSingleFile=true -o publish/linux-x64

      - name: Publish win-x64
        if: success() && startsWith(github.ref, 'refs/tags/v')
        run: dotnet publish cli/pc28xx/pc28xx.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish/win-x64

      - name: Upload publish artifacts
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pc28xx-${{ github.ref_name }}
          path: publish/
